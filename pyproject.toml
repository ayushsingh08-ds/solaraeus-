[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "solaraeus"
version = "0.2.0"
description = "Certified incremental SOLWEIG-compatible urban thermal-comfort simulation with computable error bounds"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SOLARAEUS contributors" }]
keywords = ["urban-climate", "thermal-comfort", "SOLWEIG", "UTCI", "incremental-computation", "certified-approximation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]

# Runtime dependencies derived from an AST import scan of src/ (see
# tools/golden/dep_scan.py). Every entry below is imported by shipped code.
# matplotlib is a runtime dependency because the report/plot writers ship with
# the package; it is imported lazily inside plotting functions.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "shapely>=2.0",
  "trimesh>=4.0",
  "mapbox_earcut>=1.0",
  "pyproj>=3.6",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "pythermalcomfort>=2.9",
  "psutil>=5.9",
]

[project.optional-dependencies]
# CUDA acceleration. Guarded by try/except at every import site, so the engine
# runs correctly (CPU) without it; see src/.../backend/gpu_backend.py:is_cupy_available.
gpu = ["cupy-cuda12x>=13.0"]

# Terrain raster ingest (FABDEM GeoTIFF) and viewer/3D export tooling.
viewer-export = ["rasterio>=1.3", "pillow>=10.0"]

# Everything a developer or CI job needs.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "build>=1.2",
  "rasterio>=1.3",
  "pillow>=10.0",
  "opencv-python>=4.9",
]

# Deliberately excludes [gpu]: `cupy-cuda12x` needs a CUDA toolkit at install
# time, so pulling it in by default makes `make install-dev` fail on any
# CPU-only machine or CI runner. Install GPU support explicitly with
# `pip install -e ".[gpu]"`. The engine imports CuPy lazily and runs on CPU
# without it.
all = ["solaraeus[viewer-export,dev]"]

[project.scripts]
solaraeus = "urban_comfort.cli:main"

[project.urls]
Repository = "https://github.com/ayushsingh08-ds/solaraeus"
Issues = "https://github.com/ayushsingh08-ds/solaraeus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_comfort"]

[tool.hatch.build.targets.sdist]
include = ["src", "cities", "tools", "tests", "examples", "docs", "Makefile", "README.md", "LICENSE", "CITATION.cff"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# No `pythonpath` override: the package is installed (editable) so tests import
# it the same way a user does. Run `make install` first.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: takes more than ~5 s (deselect with '-m \"not slow\"')",
  "gpu: requires a working CUDA device",
  "contracts: asserts committed artifact schemas rather than live behaviour",
  "golden: golden-master comparison cases",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]
# Frozen code is not linted:
#   tools/upstream/     third-party sources, vendored for provenance; editing
#                       them to satisfy our style rules would corrupt the audit
#                       trail (see tools/upstream/README.md).
#   tools/dataset_prep/ one-shot historical ingest scripts that ran on the
#                       machine that built the Church Street handoff and depend
#                       on that machine's paths and environment. They are kept
#                       as provenance, not maintained.
extend-exclude = ["tools/upstream", "tools/dataset_prep"]

# Enforced set: statement/import errors (E4/E7/E9), pyflakes defects (F), import
# order (I) and bugbear's bug patterns (B).  These are green on the entire tree,
# so CI can require them from day one.
#
# Deliberately NOT enforced yet -- 1650 findings on the inherited tree, mostly
# pure modernisation.  They are surfaced by `make lint-debt` and are paid down
# file by file during the readability pass, under golden-master protection:
#   UP (756), PTH (159), W293 (174), SIM (17), RET (12), C4 (2), ARG (0)
[tool.ruff.lint]
select = [
  "E4",  # import syntax
  "E7",  # statement-level errors
  "E9",  # runtime-ish syntax errors
  "F",   # pyflakes: undefined names, unused imports, redefinitions
  "I",   # isort
  "B",   # flake8-bugbear: likely bugs
]
ignore = [
  "E501",  # line length is enforced by the formatter
  "B008",  # function calls in argument defaults (dataclass idioms)
  # Bugbear rules deferred as tracked backlog (see docs/architecture.md):
  "B905",  # 21 zip(...) without strict= -- the zipped sequences are equal length
  "B007",  # 11 unused loop control variables
  "B009",  # 6 getattr() with a constant attribute
  # Pyflakes rule deferred: 32 unused locals whose removal needs per-site
  # judgement (the right-hand side may have a side effect we must keep).
  "F841",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "B011"]
"tools/**" = ["PTH123"]
"scripts/**" = ["ARG001", "ARG002", "E402", "PTH123"]
"examples/**" = ["ARG001", "ARG002", "E402", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["urban_comfort"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict on core physics, lenient elsewhere (gradual adoption)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
# The numeric core operates on untyped NumPy arrays; full strictness there is a
# separate project. Start lenient repo-wide, tighten module by module.
files = ["src"]

[[tool.mypy.overrides]]
# Strict on the small, numerically critical contract modules.
module = ["urban_comfort.config"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# Everything else starts lenient so `make types` is green from day one and the
# allowlist can grow one module at a time.  `make types-report` re-runs mypy
# with ignore_errors off (tools/mypy-report.toml) to list the tightening
# backlog: 55 errors in 24 files at the time of this overhaul.
module = ["urban_comfort.*"]
disallow_untyped_defs = false
ignore_errors = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["urban_comfort"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
